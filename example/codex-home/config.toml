# Local CODEX_HOME for the Gemini Calo Hub — used via `source codex-env.sh`.
# Keeping this out of ~/.codex means codex's global config/login is untouched,
# and a fresh CODEX_HOME forces API-key auth through the calo provider (so you
# never hit "model not supported when using Codex with a ChatGPT account").
#
# Switch models with:  codex -m <model>   (e.g. gemini-2.5-pro, amazon.nova-pro-v1:0)
model = "deepseek-chat"
model_provider = "calo"

[model_providers.calo]
name = "Gemini Calo"
base_url = "http://localhost:8000/v1"
wire_api = "responses"
env_key = "CALO_API_KEY"
